disabled_rules:
  - colon # handled by SwiftFormat
  - trailing_comma # handled by SwiftFormat
  - explicit_type_interface
  - closure_body_length
  - attributes
  - multiple_closures_with_trailing_closure
  - opening_brace # handled by SwiftFormat
  - implicit_optional_initialization
  - nesting
  - blanket_disable_command
  - superfluous_disable_command
  - strict_fileprivate
  - file_header
  - force_unwrapping
  - force_try
  - discouraged_optional_collection
  - sorted_imports
  - trailing_newline
  - vertical_whitespace
  - for_where
  - empty_count
  - redundant_type_annotation
  - non_optional_string_data_conversion

opt_in_rules:
  - fatal_error_message
  - first_where
  - toggle_bool
  - unavailable_function

excluded:
  - .build
  - DerivedData
  - fluidSubtitles.xcodeproj
  - scratch

line_length:
  warning: 320
  error: 320
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 1
  allowed_symbols: ["_"]
  excluded: [id, ui, ai, x, y, ok, xs, sm, md, lg, xl, c]

todo:
  severity: warning

# --strict promotes warnings to errors. These match the FluidVoice-scale
# files. Do not split ASRService / ContentView to satisfy smaller numbers.
type_body_length:
  warning: 2000
  error: 2000

file_length:
  warning: 3000
  error: 3000

function_body_length:
  warning: 450
  error: 450

cyclomatic_complexity:
  warning: 55
  error: 55

function_parameter_count:
  warning: 12
  error: 12

large_tuple:
  warning: 4
  error: 6

custom_rules:
  disallow_nslog:
    regex: "NSLog"
    message: "Use DebugLogger.shared.* for consistency."
  enforce_mark_spacing:
    regex: "// MARK:(?! - )"
    message: "Format section markers as `// MARK: - Section`."
