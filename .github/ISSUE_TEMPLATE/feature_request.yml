name: Feature Request
description: Suggest an idea for fluidSubtitles.
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start a [Discussion](https://github.com/chrisswimlee/fluidSubtitles/discussions) in Ideas first.
        Open this issue only after a maintainer accepts that direction.

        Describe the user problem and the behavior you want in fluidSubtitles.
  - type: input
    id: discussion
    attributes:
      label: Accepted Discussion
      description: Link the Ideas discussion a maintainer accepted. Broad or unclear features may be redirected there.
      placeholder: https://github.com/chrisswimlee/fluidSubtitles/discussions/
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
      placeholder: Users currently cannot...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the requested behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention workarounds or other approaches that were discussed.
    validations:
      required: false
