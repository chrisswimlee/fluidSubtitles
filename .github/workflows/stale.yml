name: Close Stale Issues and PRs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          start-date: "2026-07-08T00:00:00Z"

          stale-issue-label: stale
          stale-pr-label: stale

          stale-issue-message: >
            This issue has been marked stale because it has had no activity for
            30 days. It will be closed in 14 days if there is no further activity.
            Add the `keep-open` or `pinned` label to prevent automatic closure.
          stale-pr-message: >
            This pull request has been marked stale because it has had no activity
            for 45 days. It will be closed in 14 days if there is no further activity.
            Add the `keep-open` or `pinned` label to prevent automatic closure.

          close-issue-message: >
            Closing this issue because it remained inactive for 14 days after
            being marked stale.
          close-pr-message: >
            Closing this pull request because it remained inactive for 14 days
            after being marked stale.

          exempt-issue-labels: keep-open,pinned,needs reproduction,awaiting response,security,good first issue,help wanted
          exempt-pr-labels: keep-open,pinned,needs PR template,needs screenshots,security
          exempt-draft-pr: true
          remove-stale-when-updated: true
          close-issue-reason: not_planned
          delete-branch: false
