name: Close Issues Awaiting Response

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  awaiting-response:
    name: Close issues awaiting response
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy from default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Enforce awaiting response policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/policy/enforce-awaiting-response.mjs
