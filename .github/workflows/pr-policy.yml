name: PR Policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-policy:
    name: PR Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy from base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Unit-test PR policy
        run: node --test .github/policy/github-policy.test.mjs

      - name: Validate PR template and visual evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/policy/enforce-pr-policy.mjs
