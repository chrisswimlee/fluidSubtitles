name: Preview

# Unsigned preview zip for people who do not build from source. Push a tag:
#   git tag preview-1.6.11-1 && git push origin preview-1.6.11-1
# The tag must start with preview-<CFBundleShortVersionString>-. It is never v*,
# so release.yml (Developer ID + notarization) does not start. The release is
# made for the pushed tag; GITHUB_TOKEN cannot create a tag on a commit that is
# no longer the branch head.
on:
  push:
    tags:
      - "preview-*"

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Build preview zip
        run: ./build.sh preview

      - name: Upload GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          zip="dist/fluidsubtitles-${version}-preview-unsigned.zip"
          tag="${GITHUB_REF_NAME}"
          case "${tag}" in
            "preview-${version}-"*) ;;
            *)
              echo "Tag ${tag} must start with preview-${version}- to match Info.plist." >&2
              exit 1
              ;;
          esac
          if [ ! -f "${zip}" ]; then
            echo "Expected preview zip at ${zip}" >&2
            exit 1
          fi
          cat > "${RUNNER_TEMP}/notes.md" <<EOF
          **Unsigned preview.** This build is not signed with a Developer ID or notarized, so macOS blocks it the first time.

          1. Download \`$(basename "${zip}")\`, unzip it, and drag **fluidSubtitles** to Applications.
          2. Open it. When macOS says it cannot verify the app, click **Done**.
          3. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to fluidSubtitles. Confirm.
          4. Allow the microphone. Allow Accessibility only if you use Type into app.

          In-app updates are off for previews. Download the next preview by hand; macOS may ask for Microphone and Accessibility again.

          Built from ${GITHUB_SHA}. Checksum in \`SHA256SUMS\`.
          EOF
          gh release create "${tag}" "${zip}" "dist/SHA256SUMS" \
            --verify-tag \
            --prerelease \
            --title "fluidSubtitles ${version} preview (unsigned)" \
            --notes-file "${RUNNER_TEMP}/notes.md"
