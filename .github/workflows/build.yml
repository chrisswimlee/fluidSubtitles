name: Build and Test

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2

    - name: Detect build-related changes
      id: filter
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
      with:
        filters: |
          relevant:
            - 'Sources/**'
            - 'Tests/**'
            - 'fluidSubtitles.xcodeproj/**'
            - 'Package.swift'
            - 'Package.resolved'
            - 'fluidSubtitles.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
            - 'Info.plist'
            - 'fluidSubtitles.entitlements'
            - '.swiftlint.yml'
            - '.github/workflows/build.yml'

  lint:
    name: SwiftLint
    if: needs.changes.outputs.relevant == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run SwiftLint (strict)
      run: |
        docker run --rm \
          --volume "$PWD:$PWD" \
          --workdir "$PWD" \
          ghcr.io/realm/swiftlint:0.63.2 \
          lint --strict --config .swiftlint.yml

  build:
    name: Build fluidSubtitles
    if: needs.changes.outputs.relevant == 'true' && needs.lint.result == 'success'
    needs: [changes, lint]
    runs-on: macos-15
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install xcpretty
      run: sudo gem install xcpretty

    - name: Cache Whisper models
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/Library/Caches/WhisperModels
        key: ${{ runner.os }}-whisper-models-transcribecpp-v1

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: "26.3"
    
    - name: Show Xcode version
      run: xcodebuild -version
      
    # Hosted CI is Xcode 26 on macos-15. It cannot prove a live Theater listen.
    # Prove a talk on a Mac with docs/STAGE_SCORE.md. Do not invent HUD numbers.
    # Tiny Whisper GGUF output is nondeterministic on hosted macOS runners.
    # Keep this E2E assertion in the suite for local validation, but skip it in CI.
    - name: Build and test (excluding UITests and flaky Tiny Whisper E2E)
      run: |
        set -o pipefail
        xcodebuild test \
          -project fluidSubtitles.xcodeproj \
          -scheme fluidSubtitles \
          -destination 'platform=macOS,arch=arm64' \
          -skip-testing:FluidSubtitlesUITests \
          -skip-testing:FluidSubtitlesIntegrationTests/DictationE2ETests/testDictationEndToEnd_whisperTiny_transcribesFixture \
          -test-timeouts-enabled YES \
          -default-test-execution-time-allowance 60 \
          -maximum-test-execution-time-allowance 300 \
          -resultBundlePath "${RUNNER_TEMP}/Tests.xcresult" \
          CODE_SIGN_IDENTITY="-" \
          | xcpretty

    # A hung test fails after its allowance instead of eating the job timeout.
    # The result bundle keeps the failing test name and a spindump.
    - name: Upload test results
      if: failure() || cancelled()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: Tests.xcresult
        path: ${{ runner.temp }}/Tests.xcresult
        retention-days: 7

  ci-ok:
    name: Build and Test
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: [changes, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint and tests when sources changed
        run: |
          set -euo pipefail
          if [ "${{ needs.changes.outputs.relevant }}" != "true" ]; then
            echo "No build-relevant paths. Build and Test is green."
            exit 0
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "SwiftLint failed."
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build and test failed."
            exit 1
          fi

